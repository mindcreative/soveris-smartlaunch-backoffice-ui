# URL queries and referrers can contain malformed account links. Keep only
# request metadata and the normalized path in the UI access log.
log_format soveris_ui '$request_method $uri $status $body_bytes_sent';

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log soveris_ui;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /api/backoffice/auth/admission/context {
        default_type application/json;
        if ($request_uri != "/api/backoffice/auth/admission/context") { return 400 '{"code":"challenge_required"}'; }
        if ($request_method != POST) { return 405 '{"code":"challenge_required"}'; }
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $account_upstream "__GOOGLE_ACCOUNT_API_UPSTREAM__";
        proxy_pass $account_upstream;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_next_upstream off;
        proxy_redirect off;
        proxy_intercept_errors on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
        client_max_body_size 16k;
        access_log off;
        error_log /dev/null crit;
        # Preserve application 503 bodies and Retry-After; sanitize gateway failures.
        error_page 502 504 = @account_unavailable;
        error_page 413 = @account_invalid;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /api/backoffice/auth/register {
        default_type application/json;
        if ($request_uri != "/api/backoffice/auth/register") { return 400 '{"code":"challenge_required"}'; }
        if ($request_method != POST) { return 405 '{"code":"challenge_required"}'; }
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $account_upstream "__GOOGLE_ACCOUNT_API_UPSTREAM__";
        proxy_pass $account_upstream;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_next_upstream off;
        proxy_redirect off;
        proxy_intercept_errors on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
        client_max_body_size 16k;
        access_log off;
        error_log /dev/null crit;
        # Pause and capacity responses retain their application recovery contract.
        error_page 502 504 = @account_unavailable;
        error_page 413 = @account_invalid;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location ~* ^/api/backoffice/auth/(admission|register) {
        default_type application/json;
        return 400 '{"code":"challenge_required"}';
    }

    location @account_unavailable {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Retry-After "60" always;
        return 503 '{"code":"account_temporarily_unavailable"}';
    }

    location @account_invalid {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 400 '{"code":"challenge_required"}';
    }

    # The fixed installation upstream never comes from request/forwarded hosts.
    # Resolve at request time so disabled/missing Google does not break email UI.
    location ^~ /api/backoffice/auth/google/ {
        default_type application/json;
        if ($request_uri !~ "^/api/backoffice/auth/google/(context|callback|start|complete|cancel|link-proof|link)$") { return 400 '{"code":"account_flow_invalid"}'; }
        set $google_method POST;
        if ($request_uri = "/api/backoffice/auth/google/context") { set $google_method GET; }
        if ($request_method != $google_method) { return 405 '{"code":"account_flow_invalid"}'; }
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $google_account_upstream "__GOOGLE_ACCOUNT_API_UPSTREAM__";
        proxy_pass $google_account_upstream;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_next_upstream off;
        proxy_redirect off;
        proxy_intercept_errors on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 8k;
        access_log off;
        error_log /dev/null crit;
        # Google creation shares the application pause and capacity contract.
        error_page 502 504 = @google_unavailable;
        error_page 413 = @account_invalid;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location @google_unavailable {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 503 '{"code":"account_flow_unavailable"}';
    }

    location ~* ^/api/backoffice/auth/google {
        default_type application/json;
        return 400 '{"code":"account_flow_invalid"}';
    }

    location = /signup {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' __ACCOUNT_API_CONNECT_ORIGIN__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src __ACCOUNT_CHALLENGE_ORIGIN__; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location ~* ^/(signup|login|check-email|verify-email|forgot-password|reset-password|account/google/(complete|link))/*$ {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' __ACCOUNT_API_CONNECT_ORIGIN__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # SPA routing - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The prepaint preference contract must update alongside index.html.
    location = /appearance-init.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /account-proof-init.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No caching for HTML files
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
